<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO-LIST</title>
</head>
<body>
    
    <div style="background-color: lightgray; width: 200px; height : 100px;">
        <p id="Inner-p-text">Hello</p>
        <button id="Click-me-button">Click Me</button>
    </div>
    <br>
    <div style="background-color: lightgray;width: 200px; height : 100px;" id="color-div">
        <button id="Red-button">Red</button>
        <button id="Blue-button">Blue</button>
        <button id="Green-button">Green</button>
    </div>
    <br>
    <div class="counter-box"  style="background-color: lightgray;width: 200px; height : 100px;">
        <div style="width:40px; height:40px">
            <p id = "space-count">counter</p>
        </div>
        <button id="add">+</button>
        <button id = "sub">-</button>
    </div>
    <br>
    <div class="input-box"  style="background-color: lightgray;width: 200px; height : 100px;">
        <div style="width:40px; height:40px">
            <input type="text" id="maintext">
        </div>
        <button id="print">Print</button>
        <br>
        <p id="output"></p>
    </div>
    <br>
    <div class="input-box-2"  style="background-color: lightgray;width: 200px; height : 100px;">
        <input id="text-input" placeholder="Type something">

        <p>Preview: <span id="preview"></span></p>
    </div>
    

    <script src="todo.js"></script>
</body>
</html>
