<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="alert('First Go Get Arnav')"
        style="color: red; font-size: 20px; cursor: pointer;width: 200px;height: 100px; background-color: black;border-radius: 10px;">Arnav</button>

    <button id="counter" onclick="update(1)"
        style="color: red; font-size: 20px; cursor: pointer;width: 200px;height: 100px; background-color: black;border-radius: 10px;">
        0
    </button>

    <button id="disco" onclick="colorchanger('yellow')"
        style="color: red; font-size: 20px; cursor: pointer;width: 200px;height: 100px; background-color: black;border-radius: 10px;">
        Click Me
    </button>

    <script>
        let c = 0;
        function update(val) {
            c += val;
            document.getElementById("counter").innerText = c;
        }

        function colorchanger(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</body>

</html>
